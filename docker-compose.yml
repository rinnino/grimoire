services:
  db:
    image: pgvector/pgvector:pg17
    container_name: knowledge-base-db
    env_file:
      - .env.development
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_schema.sh:/docker-entrypoint-initdb.d/01_schema.sh
  backend:
    build: ./services/backend
    container_name: knowledge-base-backend
    env_file:
      - .env.development
    secrets:
      - postgres_password
      - secret_key
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend:/app
    depends_on:
      - db
      - ollama
  ollama:
    build: ./services/ollama
    container_name: knowledge-base-ollama
    env_file:
      - .env.development
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
volumes:
  postgres_data:
  ollama_data:
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  secret_key:
    file: ./secrets/secret_key
