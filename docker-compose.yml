services:
  db:
    image: pgvector/pgvector:pg17
    container_name: knowledge-base-db
    env_file:
      - .env.development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_schema.sh:/docker-entrypoint-initdb.d/01_schema.sh
  backend:
    build: ./services/backend
    container_name: knowledge-base-backend
    env_file:
      - .env.development
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend:/app
    depends_on:
      - db
      - ollama
  ollama:
    build: ./services/ollama
    container_name: knowledge-base-ollama
    env_file:
      - .env.development
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
